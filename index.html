


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road Transition 3D Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 330px;
            padding: 20px;
            background: #1f2937;
            overflow-y: auto;
        }

        h1 {
            font-size: 21px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 5px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .viewer {
            flex: 1;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 8px;
            min-width: 180px;
        }

        .table-container {
            margin-top: 20px;
            max-height: 300px;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #374151;
            padding: 5px;
            text-align: center;
        }

        th {
            background: #111827;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="sidebar">

        <h1>Road Transition Generator</h1>

        <label>Starting Lanes</label>
        <input id="startLanes" type="number" value="4" min="1">

        <label>Final Lanes</label>
        <input id="finalLanes" type="number" value="2" min="1">

        <label>Total Road Length (m)</label>
        <input id="totalLength" type="number" value="800" min="1">

        <label>Transition Length (m)</label>
        <input id="transitionLength" type="number" value="140" min="1">

        <label>Starting Road Width (m)</label>
        <input id="startWidth" type="number" value="14" min="0.1">

        <label>Final Road Width (m)</label>
        <input id="finalWidth" type="number" value="7" min="0.1">

        <label>Coordinate Interval (m)</label>
        <input id="interval" type="number" value="20" min="1">

        <button onclick="generateRoad()">
            Generate 3D Road
        </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Chainage</th>
                        <th>Width</th>
                        <th>Lanes</th>
                    </tr>
                </thead>

                <tbody id="coordinateTable"></tbody>
            </table>
        </div>

    </div>

    <div class="viewer">

        <div id="canvas-container"></div>

        <div class="info">
            <div><b>3D Road Model</b></div>
            <div id="modelInfo">Enter values and generate.</div>
        </div>

    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


/* =========================================================
   THREE.JS SETUP
========================================================= */

const container =
    document.getElementById("canvas-container");

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    10000
);

camera.position.set(
    250,
    180,
    250
);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.shadowMap.enabled = true;

container.appendChild(renderer.domElement);


/* =========================================================
   CAMERA CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    );

scene.add(ambientLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

directionalLight.position.set(
    200,
    300,
    200
);

directionalLight.castShadow = true;

scene.add(directionalLight);


/* =========================================================
   GROUND
========================================================= */

const groundGeometry =
    new THREE.PlaneGeometry(
        2000,
        2000
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4f7942
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y = -0.2;

scene.add(ground);


/* =========================================================
   GLOBAL ROAD GROUP
========================================================= */

let roadGroup = null;


/* =========================================================
   INPUT HELPER
========================================================= */

function getNumber(id) {

    return parseFloat(
        document.getElementById(id).value
    );

}


/* =========================================================
   WIDTH CALCULATION
========================================================= */

function calculateWidth(
    chainage,
    transitionLength,
    startWidth,
    finalWidth
) {

    if (chainage <= transitionLength) {

        const t =
            chainage /
            transitionLength;

        return startWidth +
            (finalWidth - startWidth) * t;

    }

    return finalWidth;

}


/* =========================================================
   LANE COUNT CALCULATION
========================================================= */

function calculateLaneCount(
    chainage,
    transitionLength,
    startLanes,
    finalLanes
) {

    if (chainage >= transitionLength) {

        return finalLanes;

    }

    /*
       We keep the lane geometry transitioning
       continuously while the final lane count
       is reached at the end of the taper.
    */

    const t =
        chainage /
        transitionLength;

    const value =
        startLanes +
        (finalLanes - startLanes) * t;

    return value;

}


/* =========================================================
   GENERATE CHAINAGES
========================================================= */

function generateChainages(
    totalLength,
    transitionLength,
    interval
) {

    const values = [];

    let x = 0;

    while (
        x < totalLength
    ) {

        values.push(x);

        x += interval;

    }

    /*
       Always include transition endpoint.
    */

    if (
        !values.includes(
            transitionLength
        ) &&
        transitionLength <= totalLength
    ) {

        values.push(
            transitionLength
        );

    }

    /*
       Always include road endpoint.
    */

    if (
        !values.includes(
            totalLength
        )
    ) {

        values.push(
            totalLength
        );

    }

    values.sort(
        (a, b) => a - b
    );

    return values;

}


/* =========================================================
   CREATE ROAD MESH
========================================================= */

function createRoadMesh(
    points,
    startWidth,
    finalWidth
) {

    const vertices = [];
    const indices = [];

    /*
       For each station create:

       left edge
       right edge

       Road centerline is Z = 0.

       Three.js coordinates:

       X = chainage
       Y = elevation
       Z = lateral position
    */

    points.forEach(point => {

        const halfWidth =
            point.width / 2;

        const leftZ =
            halfWidth;

        const rightZ =
            -halfWidth;

        /*
           Left edge
        */

        vertices.push(
            point.x,
            0,
            leftZ
        );

        /*
           Right edge
        */

        vertices.push(
            point.x,
            0,
            rightZ
        );

    });


    /*
       Create triangles between
       consecutive stations.
    */

    for (
        let i = 0;
        i < points.length - 1;
        i++
    ) {

        const a = i * 2;

        const b = a + 1;

        const c = a + 2;

        const d = a + 3;

        /*
           Triangle 1
        */

        indices.push(
            a,
            b,
            c
        );

        /*
           Triangle 2
        */

        indices.push(
            b,
            d,
            c
        );

    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({

            color: 0x303030,

            roughness: 0.9,

            metalness: 0.0,

            side: THREE.DoubleSide

        });


    return new THREE.Mesh(
        geometry,
        material
    );

}


/* =========================================================
   CREATE LANE MARKINGS
========================================================= */

function createLaneMarkings(
    points,
    startLanes,
    finalLanes,
    transitionLength
) {

    const group =
        new THREE.Group();


    for (
        let laneIndex = 1;
        laneIndex < startLanes;
        laneIndex++
    ) {

        const linePoints = [];


        points.forEach(point => {

            let laneCount;

            if (
                point.x <=
                transitionLength
            ) {

                const t =
                    point.x /
                    transitionLength;

                laneCount =
                    startLanes +
                    (
                        finalLanes -
                        startLanes
                    ) * t;

            } else {

                laneCount =
                    finalLanes;

            }


            /*
               For a lane boundary,
               calculate normalized position.
            */

            const normalized =
                laneIndex /
                startLanes;


            /*
               Once transition is complete,
               hide boundaries that no longer exist.
            */

            if (
                laneCount < laneIndex
            ) {

                return;

            }


            const halfWidth =
                point.width / 2;


            const z =
                halfWidth -
                (
                    normalized *
                    point.width
                );


            linePoints.push(
                new THREE.Vector3(
                    point.x,
                    0.04,
                    z
                )
            );

        });


        if (
            linePoints.length >= 2
        ) {

            const geometry =
                new THREE.BufferGeometry()
                    .setFromPoints(
                        linePoints
                    );


            const material =
                new THREE.LineDashedMaterial({

                    color: 0xffffff,

                    dashSize: 4,

                    gapSize: 4,

                    linewidth: 1

                });


            const line =
                new THREE.Line(
                    geometry,
                    material
                );

            line.computeLineDistances();

            group.add(line);

        }

    }


    /*
       Centerline
    */

    const centerPoints =
        points.map(point => {

            return new THREE.Vector3(
                point.x,
                0.05,
                0
            );

        });


    const centerGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                centerPoints
            );


    const centerMaterial =
        new THREE.LineBasicMaterial({
            color: 0xffff00
        });


    const centerLine =
        new THREE.Line(
            centerGeometry,
            centerMaterial
        );


    group.add(centerLine);


    return group;

}


/* =========================================================
   CREATE ROAD EDGE LINES
========================================================= */

function createRoadEdges(points) {

    const group =
        new THREE.Group();


    const leftPoints =
        points.map(point => {

            return new THREE.Vector3(
                point.x,
                0.06,
                point.width / 2
            );

        });


    const rightPoints =
        points.map(point => {

            return new THREE.Vector3(
                point.x,
                0.06,
                -point.width / 2
            );

        });


    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });


    const leftGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                leftPoints
            );


    const rightGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                rightPoints
            );


    group.add(
        new THREE.Line(
            leftGeometry,
            material
        )
    );


    group.add(
        new THREE.Line(
            rightGeometry,
            material
        )
    );


    return group;

}


/* =========================================================
   COORDINATE TABLE
========================================================= */

function updateTable(points) {

    const table =
        document.getElementById(
            "coordinateTable"
        );

    table.innerHTML = "";


    points.forEach(point => {

        const row =
            document.createElement("tr");


        row.innerHTML = `
            <td>${point.x.toFixed(2)}</td>
            <td>${point.width.toFixed(2)}</td>
            <td>${point.lanes.toFixed(2)}</td>
        `;


        table.appendChild(row);

    });

}


/* =========================================================
   MAIN GENERATOR
========================================================= */

window.generateRoad =
function() {

    /*
       Remove previous model
    */

    if (roadGroup) {

        scene.remove(
            roadGroup
        );

    }


    roadGroup =
        new THREE.Group();


    /*
       Read user inputs
    */

    const startLanes =
        getNumber("startLanes");

    const finalLanes =
        getNumber("finalLanes");

    const totalLength =
        getNumber("totalLength");

    const transitionLength =
        getNumber("transitionLength");

    const startWidth =
        getNumber("startWidth");

    const finalWidth =
        getNumber("finalWidth");

    const interval =
        getNumber("interval");


    /*
       Validation
    */

    if (
        transitionLength >
        totalLength
    ) {

        alert(
            "Transition length cannot be greater than total road length."
        );

        return;

    }


    if (
        startLanes < finalLanes
    ) {

        /*
           This implementation supports
           lane reduction.
        */

    }


    /*
       Generate chainages
    */

    const chainages =
        generateChainages(
            totalLength,
            transitionLength,
            interval
        );


    /*
       Generate road points
    */

    const points =
        chainages.map(x => {

            const width =
                calculateWidth(
                    x,
                    transitionLength,
                    startWidth,
                    finalWidth
                );


            const lanes =
                calculateLaneCount(
                    x,
                    transitionLength,
                    startLanes,
                    finalLanes
                );


            return {

                x: x,

                width: width,

                lanes: lanes

            };

        });


    /*
       Create road
    */

    const road =
        createRoadMesh(
            points,
            startWidth,
            finalWidth
        );


    roadGroup.add(
        road
    );


    /*
       Lane markings
    */

    const markings =
        createLaneMarkings(
            points,
            startLanes,
            finalLanes,
            transitionLength
        );


    roadGroup.add(
        markings
    );


    /*
       Road edges
    */

    const edges =
        createRoadEdges(
            points
        );


    roadGroup.add(
        edges
    );


    /*
       Add group to scene
    */

    scene.add(
        roadGroup
    );


    /*
       Update table
    */

    updateTable(
        points
    );


    /*
       Information
    */

    document.getElementById(
        "modelInfo"
    ).innerHTML = `
        Length: ${totalLength} m<br>
        Transition: ${transitionLength} m<br>
        Width: ${startWidth} → ${finalWidth} m<br>
        Lanes: ${startLanes} → ${finalLanes}
    `;


    /*
       Center camera on road
    */

    camera.position.set(
        totalLength * 0.45,
        Math.max(
            100,
            totalLength * 0.25
        ),
        totalLength * 0.35
    );


    controls.target.set(
        totalLength / 2,
        0,
        0
    );


    controls.update();

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            container.clientWidth /
            container.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

    }
);


/* =========================================================
   RENDER LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/*
   Generate default model
*/

generateRoad();

</script>

</body>
</html>
